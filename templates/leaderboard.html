<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 10 Graczy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; color: #e94560; }
        .table { color: #fff; }
        .table-striped > tbody > tr:nth-of-type(odd) > * {
            color: #fff; background-color: #16213e;
        }
    </style>
</head>
<body class="container mt-5 text-center">
    <h1 class="mb-4">Najlepsi Obrońcy Ziemi</h1>

    <div class="card bg-dark border-secondary">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Gracz</th>
                        <th scope="col">Wynik</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in scores %}
                    <tr>
                        <th scope="row">{{ loop.index }}</th>
                        <td>{{ row[0] }}</td> <td>{{ row[1] }}</td> </tr>
                    {% else %}
                    <tr>
                        <td colspan="3">Brak wyników. Bądź pierwszy!</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-4">
        <a href="/" class="btn btn-lg btn-success">Zagraj Ponownie</a>
    </div>
</body>
</html>
